services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: gpxaccess
      POSTGRES_USER: gpxaccess
      POSTGRES_PASSWORD: "G7wN4qX9mK2vR8cT6pL3sD5hF1zB0yUa"
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [internal]
  backend:
    build: ./backend
    environment:
      APP_NAME: GPX Accès Secours
      ENVIRONMENT: production
      MAX_UPLOAD_MB: "10"
      SEGMENT_LENGTH_M: "30"
      OVERPASS_URLS: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://overpass.nchc.org.tw/api/interpreter
      OVERPASS_TIMEOUT_SECONDS: "25"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://gpxaccess:G7wN4qX9mK2vR8cT6pL3sD5hF1zB0yUa@db:5432/gpxaccess
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: "V9rK2xQ7nM4cW8pT1yH6sF3dL5zB0uEa"
    depends_on:
      redis: {condition: service_healthy}
      db: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=INFO
    environment:
      APP_NAME: GPX Accès Secours
      ENVIRONMENT: production
      MAX_UPLOAD_MB: "10"
      SEGMENT_LENGTH_M: "30"
      OVERPASS_URLS: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter,https://overpass.nchc.org.tw/api/interpreter
      OVERPASS_TIMEOUT_SECONDS: "25"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://gpxaccess:G7wN4qX9mK2vR8cT6pL3sD5hF1zB0yUa@db:5432/gpxaccess
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: "V9rK2xQ7nM4cW8pT1yH6sF3dL5zB0uEa"
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    ports: ["3117:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    restart: unless-stopped
    networks: [internal]
volumes:
  postgres_data:
  redis_data:
networks:
  internal:
    driver: bridge
