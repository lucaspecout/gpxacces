server {
  listen 80;
  # L'enveloppe multipart ajoute quelques octets au fichier GPX de 10 Mo.
  client_max_body_size 11m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /api/ { proxy_pass http://backend:8000/; proxy_connect_timeout 10s; proxy_read_timeout 75s; proxy_send_timeout 75s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }
}
