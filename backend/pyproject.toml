[project]
name = "gpx-access-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9",
  "defusedxml>=0.7,<1", "httpx>=0.27,<1", "redis>=5,<6", "celery>=5.4,<6",
  "pydantic-settings>=2.4,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"

